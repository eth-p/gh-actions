name: "Revoke GitHub App Token"
description: "Revokes a GitHub App Token created by actions/create-github-app-token."
inputs:
  token:
    description: "The token to revoke."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Revoke Token"
      if: ${{ always() }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |-
        set -euo pipefail
        if error=$(gh api --method DELETE /installation/token 2>&1 >/dev/null); then
          echo "Token revoked."
        else
          echo "::warning title=Error Revoking Token::${error}"
        fi
