# This is a workflow used to validate the behavior of an action in this repo.
name: "Test Action: create-ci-branch"

on:
  push:
    paths: &paths
      #
      # ----- BEGIN DETECTED DEPENDENCIES -----
      - checkout-as-app/action.yaml
      - cleanup-hook/action-main.js
      - cleanup-hook/action-post.js
      - cleanup-hook/action.yaml
      - cleanup-hook/inputs.js
      - create-ci-branch/action.yaml
      - create-ci-branch/cleanup/action.yaml
      - create-ci-branch/cleanup/cleanup.sh
      - .github/workflows/test-action-checkout-as-app.yaml
      - .github/workflows/test-action-cleanup-hook.yaml
      - .github/workflows/test-action-create-ci-branch.yaml
      # ----- END DETECTED DEPENDENCIES -----
  pull_request:
    paths: *paths

env:
  TEST_REPO: eth-p/gh-actions-test-repo

jobs:
  test-with-defaults:
    name: "Create CI Branch Works"
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: $/create-ci-branch
        with:
          ghapp-client-id: ${{ secrets.GHAPP_CLIENT_ID }}
          ghapp-private-key: ${{ secrets.GHAPP_PRIVATE_KEY }}
          repository: ${{ env.TEST_REPO }}
          cleanup-after-job: true

      - name: "Output: branch"
        shell: bash
        env: { OUTPUT: "${{ steps.action.outputs.branch }}" }
        run: |-
          set -euo pipefail
          test -n "$OUTPUT"

      - name: "Output: banner"
        shell: bash
        env: { OUTPUT: "${{ steps.action.outputs.banner }}" }
        run: |-
          set -euo pipefail
          test -n "$OUTPUT"

      - name: "Output: git-name"
        shell: bash
        env: { OUTPUT: "${{ steps.action.outputs.git-name }}" }
        run: |-
          set -euo pipefail
          test -n "$OUTPUT"

      - name: "Output: git-email"
        shell: bash
        env: { OUTPUT: "${{ steps.action.outputs.git-email }}" }
        run: |-
          set -euo pipefail
          test -n "$OUTPUT"

      - name: "Output: token"
        shell: bash
        env: { OUTPUT: "${{ steps.action.outputs.token }}" }
        run: |-
          set -euo pipefail
          test -n "$OUTPUT"

      - name: "Assert: Repo is shallow"
        shell: bash
        run: |-
          set -euo pipefail
          if [[ $(git rev-parse --is-shallow-repository) != "true" ]]; then
            printf "\x1B[31mNot cloned as a shallow repo.\x1B[m\n"
            exit 1
          fi

      - name: "Assert: Branch exists on remote"
        shell: bash
        env: { BRANCH: "${{ steps.action.outputs.branch }}" }
        run: |-
          set -euo pipefail
          test -n "$(git ls-remote origin "refs/heads/${BRANCH}")"

      - name: "Assert: Sets TEST_BRANCH environment variable"
        shell: bash
        run: |-
          set -euo pipefail
          test -n "${TEST_BRANCH:-}"

  test-cleanup-setup:
    name: "Cleanup Hook (Setup)"
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.test-branch.outputs.branch }}
    steps:
      - id: test-branch
        uses: $/create-ci-branch
        with:
          ghapp-client-id: ${{ secrets.GHAPP_CLIENT_ID }}
          ghapp-private-key: ${{ secrets.GHAPP_PRIVATE_KEY }}
          repository: ${{ env.TEST_REPO }}
          cleanup-after-job: true

  test-cleanup:
    name: "Cleanup Hook"
    needs: [test-cleanup-setup]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repo"
        id: checkout
        uses: $/checkout-as-app
        with:
          ghapp-client-id: ${{ secrets.GHAPP_CLIENT_ID }}
          ghapp-private-key: ${{ secrets.GHAPP_PRIVATE_KEY }}
          repository: ${{ env.TEST_REPO }}

      - name: "Assert: Branch no longer exists on remote"
        shell: bash
        env: { BRANCH: "${{ needs.test-cleanup-setup.outputs.branch }}" }
        run: |-
          set -euo pipefail
          test -z "$(git ls-remote origin "refs/heads/${BRANCH}")"
